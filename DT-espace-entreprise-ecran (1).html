<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Djibouti Telecom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--jaune:#fbbc12;--bleu:#0a4ac0;--marine:#00397f;--fond:#eef2f8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
body{background:var(--fond);font-family:"Nunito","Segoe UI",Arial,sans-serif;color:var(--marine);overflow:hidden;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
body.repos{cursor:none}

/* Bandeau fixe */
.bandeau{flex:0 0 auto;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:clamp(10px,2.2vh,36px) clamp(24px,4vw,72px);border-bottom:4px solid var(--jaune)}
.marque{display:flex;align-items:center;gap:clamp(14px,1.4vw,24px)}
.marque .embleme{width:min(clamp(44px,4.6vw,80px),7vh)}
.marque .mot{font-weight:900;font-size:clamp(1.2rem,2.1vw,2.3rem);line-height:1;letter-spacing:-.02em}
.marque .mot small{display:block;font-weight:700;font-size:.42em;letter-spacing:.18em;text-transform:uppercase;opacity:.6;margin-top:6px}

.meteo{display:flex;align-items:center;gap:clamp(10px,1.2vw,18px);margin-left:auto;margin-right:clamp(24px,4vw,72px);padding:clamp(8px,1vh,12px) clamp(14px,1.4vw,22px);border-radius:999px;background:var(--fond);border:1px solid rgba(0,57,127,.08)}
.meteo .mico{width:clamp(34px,3.4vw,56px);height:clamp(34px,3.4vw,56px);fill:none;stroke:var(--marine);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.meteo .mico .sol{fill:var(--jaune);stroke:none}.meteo .mico .nua{fill:#fff;stroke:var(--marine)}
.meteo .mt{font-weight:900;font-size:clamp(1.2rem,2vw,2.1rem);line-height:1;letter-spacing:-.03em}
.meteo .md{font-weight:700;font-size:clamp(.66rem,.85vw,.9rem);letter-spacing:.06em;text-transform:uppercase;opacity:.6;margin-top:4px}
@media (max-width:820px){.meteo .md{display:none}}
.horloge{text-align:right}
.horloge .h{font-weight:900;font-size:min(clamp(1.8rem,3.4vw,3.6rem),5.5vh);line-height:1;letter-spacing:-.03em}
.horloge .d{font-weight:700;font-size:clamp(.72rem,.95vw,1rem);letter-spacing:.1em;text-transform:uppercase;opacity:.6;margin-top:6px}

/* Livre */
.scene{flex:1 1 auto;position:relative;perspective:3000px;overflow:hidden}
.livre{position:absolute;inset:0;transform-style:preserve-3d}
.page{position:absolute;inset:0;transform-origin:center bottom;transform-style:preserve-3d;background:#fff}
.page .recto,.page .verso{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.page .verso{transform:rotateX(180deg);background:linear-gradient(180deg,#ffffff,#eef2f8)}
.page .verso::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.16),transparent 30%)}
.page .recto{display:grid;grid-template-columns:1.1fr .9fr;align-items:center;padding:clamp(20px,6vh,120px) clamp(32px,7vw,140px);gap:clamp(20px,4vw,60px)}
.page .recto::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.22),transparent 45%);opacity:0;transition:opacity .5s;z-index:2;pointer-events:none}
.page.tourne{animation:tourne 1.7s cubic-bezier(.6,.05,.3,1) forwards;z-index:5;box-shadow:0 -40px 90px rgba(0,0,0,.25)}
@keyframes tourne{0%{transform:rotateX(0)}100%{transform:rotateX(-180deg)}}
.page.suivante{z-index:2}.page.courante{z-index:3}
.page.ombree .recto::before{opacity:1}

.jaune .recto{background:radial-gradient(ellipse 60% 80% at 80% 20%,rgba(255,255,255,.35),transparent 60%),linear-gradient(135deg,#ffc933 0%,#f7b400 100%);color:var(--marine)}
.bleu .recto{background:radial-gradient(ellipse 60% 80% at 80% 20%,rgba(255,255,255,.16),transparent 60%),linear-gradient(135deg,#1259d8 0%,#003a86 100%);color:#fff}
.blanc .recto{background:radial-gradient(ellipse 60% 80% at 80% 20%,rgba(10,74,192,.08),transparent 60%),linear-gradient(135deg,#ffffff 0%,#eef2f8 100%);color:var(--marine)}
.texte{display:grid;gap:clamp(8px,1.8vh,26px);justify-items:start}
.pastille{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.92);box-shadow:0 10px 30px rgba(0,0,0,.12);color:var(--marine);font-weight:900;font-size:clamp(.66rem,.85vw,.95rem);padding:.5em 1.1em;border-radius:999px;text-transform:uppercase;letter-spacing:.06em}
.pastille i{width:10px;height:10px;background:var(--jaune);border-radius:2px}
.bleu .pastille i{background:var(--bleu)}
.blanc .pastille{background:var(--fond)}
.titre{margin:0;font-weight:900;line-height:.98;letter-spacing:-.025em;text-transform:uppercase;font-size:min(clamp(1.8rem,5vw,6.2rem),9.5vh)}
.bleu .titre em{font-style:normal;color:var(--jaune)}
.jaune .titre em,.blanc .titre em{font-style:normal;color:var(--bleu)}
.sous{margin:0;font-weight:700;font-size:min(clamp(.9rem,1.3vw,1.4rem),2.6vh);line-height:1.4;max-width:30ch;opacity:.9}

/* Illustration à droite : téléphone, carré-motif ou icônes */
.visuel{display:grid;place-items:center;height:100%}
.tel{width:clamp(120px,14vw,250px);aspect-ratio:9/18.5;background:#111;border-radius:12%/6%;padding:3%;box-shadow:0 40px 70px rgba(0,0,0,.28);transform:rotate(-6deg);position:relative}
.tel .ecran{position:absolute;inset:3%;background:#f7f8fb;border-radius:10%/5%;overflow:hidden}
.tel .ecran::before{content:"";position:absolute;left:30%;right:30%;top:3%;height:4%;background:#111;border-radius:999px}
.tel .ui{position:absolute;inset:12% 8% 5%;display:grid;gap:7%;grid-auto-rows:min-content}
.tel .ui b{display:block;height:2.4vh;background:var(--jaune);border-radius:6px}
.tel .ui s{display:block;height:1.4vh;background:#dfe5ef;border-radius:4px}
.tel .ui s.b{background:var(--bleu);width:60%}.tel .ui s.j{background:var(--jaune);width:45%}
.motif{width:clamp(130px,16vw,280px);display:grid;grid-template-columns:1fr 1fr;gap:5%}
.motif i{aspect-ratio:1;background:rgba(255,255,255,.92);border-radius:8px}
.motif i:first-child{background:var(--jaune);transform:translate(-6%,-6%)}
.jaune .motif i{background:var(--marine)}.jaune .motif i:first-child{background:#fff}
.icones{display:flex;gap:clamp(10px,1.4vw,22px)}
.icones span{width:clamp(56px,6vw,110px);height:clamp(56px,6vw,110px);border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 20px 40px rgba(0,0,0,.12)}
.icones svg{width:50%;height:50%;fill:none;stroke:var(--marine);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}


/* Illustrations */
.visuel .verre{position:relative;width:auto;max-width:clamp(300px,42vw,720px);padding:min(clamp(26px,3.4vw,56px),4vh);border-radius:32px;
 background:linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.45);
 box-shadow:0 50px 100px rgba(0,30,80,.28),inset 0 1px 0 rgba(255,255,255,.6);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}
.blanc .visuel .verre{background:linear-gradient(135deg,rgba(255,255,255,.9),rgba(255,255,255,.55));border-color:#fff;box-shadow:0 50px 100px rgba(0,57,127,.14),inset 0 1px 0 #fff}
.jaune .visuel .verre{box-shadow:0 50px 100px rgba(120,70,0,.22),inset 0 1px 0 rgba(255,255,255,.7)}
.visuel .verre::before{content:"";position:absolute;width:60%;height:60%;left:-15%;top:-20%;border-radius:50%;filter:blur(60px);z-index:-1;background:rgba(251,188,18,.55)}
.jaune .visuel .verre::before{background:rgba(255,255,255,.7)}.blanc .visuel .verre::before{background:rgba(10,74,192,.18)}
.ill .p1,.ill .p2{filter:url(#ombre)}
.ill .p1{fill:url(#gBlanc)}.ill .p2{fill:url(#gJaune)}
.jaune .ill .p1{fill:url(#gMarine)}.jaune .ill .p2{fill:url(#gBlanc)}
.blanc .ill .p1{fill:url(#gMarine)}.blanc .ill .p2{fill:url(#gJaune)}

.ill{width:min(100%,clamp(260px,38vw,660px),calc(min(42vh,100vh - 400px) * 1.3125));height:auto;overflow:visible;display:block}
.ill .p1{fill:#fff}.ill .p2{fill:var(--jaune)}.ill .p3{fill:rgba(255,255,255,.28)}.ill .l1{stroke:#fff}.ill .l2{stroke:var(--jaune)}
.jaune .ill .p1{fill:var(--marine)}.jaune .ill .p2{fill:#fff}.jaune .ill .p3{fill:rgba(0,57,127,.18)}.jaune .ill .l1{stroke:var(--marine)}.jaune .ill .l2{stroke:#fff}
.blanc .ill .p1{fill:var(--marine)}.blanc .ill .p2{fill:var(--jaune)}.blanc .ill .p3{fill:rgba(0,57,127,.10)}.blanc .ill .l1{stroke:var(--marine)}.blanc .ill .l2{stroke:var(--jaune)}
.ill line,.ill path.lien,.ill circle.lien{fill:none;stroke-width:4;stroke-linecap:round}
.ill .tiret{stroke-dasharray:10 14;animation:file 1.6s linear infinite}
@keyframes file{to{stroke-dashoffset:-24}}
.ill .pulse{animation:pulse 2.4s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes pulse{0%,100%{opacity:.5;transform:scale(.9)}50%{opacity:1;transform:scale(1.08)}}
.ill .flotte{animation:flotteI 5s ease-in-out infinite}
@keyframes flotteI{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.ill .onde{fill:none;stroke-width:4;stroke-linecap:round;animation:onde 2.2s ease-out infinite;transform-origin:center;transform-box:fill-box}
.ill .onde.o2{animation-delay:.5s}.ill .onde.o3{animation-delay:1s}
@keyframes onde{0%{opacity:0;transform:scale(.6)}30%{opacity:1}100%{opacity:0;transform:scale(1.25)}}

/* Dock de verre */
.dock{position:fixed;z-index:7;left:50%;transform:translateX(-50%);bottom:calc(clamp(12px,2.4vh,36px) + env(safe-area-inset-bottom,0px));
 width:min(92vw,1500px);display:grid;grid-template-columns:auto 1.35fr 1.65fr;align-items:center;
 background:rgba(2,24,60,.62);color:#fff;border:1px solid rgba(255,255,255,.22);border-radius:22px;
 backdrop-filter:blur(26px) saturate(1.3);-webkit-backdrop-filter:blur(26px) saturate(1.3);
 box-shadow:0 30px 80px rgba(0,20,60,.35),inset 0 1px 0 rgba(255,255,255,.28)}
.dock>section{padding:clamp(8px,1.5vh,20px) clamp(22px,2.4vw,40px);min-width:0}
.dock>section{position:relative}
.dock>section+section::before{content:"";position:absolute;left:0;top:18%;bottom:18%;width:1px;background:linear-gradient(to bottom,transparent,rgba(255,255,255,.38) 30%,rgba(255,255,255,.38) 70%,transparent)}
.dock>section+section::after{content:"";position:absolute;left:-2px;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:var(--jaune);box-shadow:0 0 10px rgba(251,188,18,.8)}
.d-lab{font-size:clamp(.58rem,.7vw,.76rem);font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.55);margin-bottom:clamp(3px,.6vh,6px)}
.d-val{font-weight:900;font-size:min(clamp(1.2rem,1.9vw,2rem),3.4vh);line-height:1;letter-spacing:-.03em;display:flex;align-items:baseline;gap:.4em}
.d-val b{color:var(--jaune)}
.d-meteo{display:flex;align-items:center;gap:clamp(10px,1.1vw,18px)}
.d-meteo[hidden]{display:none!important}
.d-meteo .mico{width:clamp(36px,3.2vw,52px);height:clamp(36px,3.2vw,52px);fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.d-meteo .mico .sol{fill:var(--jaune);stroke:none}.d-meteo .mico .nua{fill:rgba(255,255,255,.18);stroke:#fff}
.d-mtemp{font-weight:400;font-size:min(clamp(1.9rem,3vw,3.2rem),5vh);line-height:1;letter-spacing:-.04em;white-space:nowrap}
.d-mtemp sup{font-size:.38em;font-weight:700;vertical-align:top;margin-left:2px;color:rgba(255,255,255,.75)}
.d-mtxt{display:grid;gap:4px}
.d-metat{font-weight:900;font-size:clamp(.95rem,1.25vw,1.3rem);line-height:1.1}
.d-ress{font-size:clamp(.78rem,1vw,1.05rem);font-weight:700;color:rgba(255,255,255,.6)}
.d-ress b{color:var(--jaune);font-weight:900}
.d-barre{height:3px;background:rgba(255,255,255,.14);border-radius:2px;margin:clamp(5px,1vh,10px) 0 clamp(4px,.8vh,8px);overflow:hidden}
.d-barre i{display:block;height:100%;background:linear-gradient(90deg,var(--jaune),#ffe08a);border-radius:2px;width:0;transition:width 1s}
.d-liste{display:flex;gap:clamp(8px,1vw,16px)}
.d-liste span{font-size:clamp(.6rem,.72vw,.8rem);font-weight:700;color:rgba(255,255,255,.5);white-space:nowrap}
.d-liste span i{font-style:normal;margin-left:.35em;color:rgba(255,255,255,.8)}
.d-liste span.on,.d-liste span.on i{color:var(--jaune)}
.d-actu-txt{font-weight:700;font-size:min(clamp(.95rem,1.25vw,1.35rem),2.3vh);line-height:1.3;min-height:2.6em;display:flex;align-items:center;transition:opacity .5s}
.d-actu-txt.fondu{opacity:0}
.d-points{display:flex;gap:6px;margin-top:8px}
.d-points i{width:18px;height:3px;border-radius:2px;background:rgba(255,255,255,.2);overflow:hidden;position:relative}
.d-points i::after{content:"";position:absolute;inset:0;background:var(--jaune);transform:scaleX(0);transform-origin:left}
.d-points i.on::after{animation:remplit 8s linear forwards}
@keyframes remplit{to{transform:none}}
.d-reste{font-style:normal;margin-left:.5em;align-self:center;background:var(--jaune);color:var(--marine);font-weight:900;font-size:clamp(.62rem,.78vw,.86rem);letter-spacing:.02em;padding:.45em .9em;border-radius:999px;white-space:nowrap}
.d-reste::before{content:"dans ";font-weight:700}
.page .recto{padding-bottom:calc(4vh + 140px)}
.visuel{align-self:center}
@media (max-width:1100px){.dock{grid-template-columns:auto 1fr;grid-template-rows:auto auto}.d-liste{display:none}}
.repere{position:absolute;z-index:6;right:clamp(24px,4vw,72px);top:clamp(12px,2.2vh,22px);display:flex;gap:6px}
.repere i{width:18px;height:3px;border-radius:2px;background:rgba(255,255,255,.4)}
.repere i.on{background:#fff}
.blanc-on .repere i{background:rgba(0,57,127,.25)}.blanc-on .repere i.on{background:var(--marine)}
.outils{position:fixed;z-index:9;right:10px;bottom:calc(8px + env(safe-area-inset-bottom,0px));transition:opacity .6s}
body.repos .outils{opacity:0;pointer-events:none}
.outils button{font:inherit;font-size:.9rem;color:var(--marine);background:#fff;border:1px solid rgba(0,57,127,.15);border-radius:8px;width:30px;height:30px;padding:0;cursor:pointer}
@media (max-width:820px){.page .recto{grid-template-columns:1fr;align-content:center}.visuel{display:none}.titre{font-size:clamp(2rem,8vw,4rem)}.sous{font-size:1.1rem}.horloge .d{display:none}}
@media (prefers-reduced-motion:reduce){.page.tourne{animation-duration:.01s}}
</style></head><body>
<header class="bandeau">
 <div class="marque"><svg class="embleme" viewBox="0 0 100 102" role="img" aria-label="Djibouti Telecom"><rect class="o" x="4.5" y="4.5" width="47" height="47" fill="#e8e8eb"/><rect class="n1" x="53" y="4.5" width="47" height="47" fill="#00397f"/><rect class="n2" x="3" y="55" width="47" height="47" fill="#00397f"/><rect class="n3" x="53" y="55" width="47" height="47" fill="#00397f"/><rect class="j" x="0" y="0" width="47" height="47" fill="#fbbc12"/></svg><div class="mot">Djibouti Telecom<small>Espace entreprise et Grand Compte</small></div></div>
 <div class="horloge" aria-hidden="true"><div class="h" id="h"></div><div class="d" id="d"></div></div>
</header>
<main class="scene"><div class="livre" id="livre"></div><div class="repere" id="repere" aria-hidden="true"></div></main>

<aside class="dock" aria-label="Informations">
 <section class="d-meteo" id="meteo" hidden>
  <svg class="mico" viewBox="0 0 64 64" id="mico" aria-hidden="true"></svg>
  <div class="d-mtemp"><span id="mtemp"></span><sup>°C</sup></div>
  <div class="d-mtxt"><div class="d-metat" id="mdesc"></div><div class="d-ress">ressenti <b id="mress"></b></div></div>
 </section>
 <section class="d-priere">
  <div class="d-lab">Prochaine prière</div>
  <div class="d-val"><b id="prNom"></b><span id="prHeure"></span><em class="d-reste" id="prReste"></em></div>
  <div class="d-barre"><i id="prBarre"></i></div>
  <div class="d-liste" id="prListe"></div>
 </section>
 <section class="d-actu">
  <div class="d-lab">À la une</div>
  <div class="d-actu-txt" id="actuTxt"></div>
  <div class="d-points" id="actuPts"></div>
 </section>
</aside>

<div class="outils"><button id="plein" type="button" title="Plein écran (F)">⛶</button></div>
<script>
(function(){
 var TEL='<div class="tel"><div class="ecran"><div class="ui"><b></b><s></s><s class="b"></s><s></s><s class="j"></s><s></s><b></b><s></s></div></div></div>';
 var MOTIF='<div class="motif"><i></i><i></i><i></i><i></i></div>';
 var ICO='<div class="icones"><span><svg viewBox="0 0 24 24"><path d="M3 7h18v10H3z"/><path d="M3 11h18"/></svg></span><span><svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg></span><span><svg viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg></span></div>';
  var RESEAU='<div class="motif"><i></i><i></i><i></i><i></i></div>';
 var ILL={BIENV:`<svg class="ill" viewBox="0 0 420 320" aria-hidden="true"><defs><linearGradient id="gBlanc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d6e3ff"/></linearGradient><linearGradient id="gJaune" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd44d"/><stop offset="1" stop-color="#f2a900"/></linearGradient><linearGradient id="gMarine" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1f63d8"/><stop offset="1" stop-color="#00397f"/></linearGradient><filter id="ombre" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000" flood-opacity=".22"/></filter></defs>
<rect class="p3" x="40" y="130" width="110" height="170" rx="8"/><rect class="p1" x="120" y="60" width="150" height="240" rx="10"/><rect class="p3" x="250" y="110" width="130" height="190" rx="8"/>
<g class="p2"><rect x="140" y="85" width="22" height="22" rx="3"/><rect x="184" y="85" width="22" height="22" rx="3"/><rect x="228" y="85" width="22" height="22" rx="3"/><rect x="140" y="130" width="22" height="22" rx="3"/><rect x="184" y="130" width="22" height="22" rx="3"/><rect x="228" y="130" width="22" height="22" rx="3"/><rect x="140" y="175" width="22" height="22" rx="3"/><rect x="184" y="175" width="22" height="22" rx="3"/><rect x="228" y="175" width="22" height="22" rx="3"/></g>
<rect class="p2" x="176" y="240" width="38" height="60" rx="4"/>
<g class="flotte"><rect class="p2" x="300" y="30" width="44" height="44" rx="6"/><rect class="p1" x="352" y="30" width="44" height="44" rx="6"/><rect class="p1" x="300" y="82" width="44" height="44" rx="6"/><rect class="p1" x="352" y="82" width="44" height="44" rx="6"/></g>

 (function(){
  var LAT=11.59,LON=43.15,TZ=3,FAJR=18,ISHA=17,r=Math.PI/180;
  function calc(d){
   var y=d.getFullYear(),m=d.getMonth()+1,j=d.getDate(),a=Math.floor((14-m)/12),Y=y+4800-a,M=m+12*a-3;
   var JD=j+Math.floor((153*M+2)/5)+365*Y+Math.floor(Y/4)-Math.floor(Y/100)+Math.floor(Y/400)-32045-0.5;
   var D=JD-2451545.0,g=(357.529+0.98560028*D)%360,q=(280.459+0.98564736*D)%360;
   var L=(q+1.915*Math.sin(g*r)+0.020*Math.sin(2*g*r))%360,e=23.439-0.00000036*D;
   var RA=Math.atan2(Math.cos(e*r)*Math.sin(L*r),Math.cos(L*r))/r/15;RA=(RA+24)%24;
   var dec=Math.asin(Math.sin(e*r)*Math.sin(L*r))/r,EqT=q/15-RA,dhuhr=12+TZ-LON/15-EqT;
   function T(ang){return Math.acos((-Math.sin(ang*r)-Math.sin(LAT*r)*Math.sin(dec*r))/(Math.cos(LAT*r)*Math.cos(dec*r)))/r/15;}
   function A(t){return Math.acos((Math.sin(Math.atan(1/(t+Math.tan(Math.abs(LAT-dec)*r))))-Math.sin(LAT*r)*Math.sin(dec*r))/(Math.cos(LAT*r)*Math.cos(dec*r)))/r/15;}
   return[['Fajr',dhuhr-T(FAJR)],['Dhuhr',dhuhr],['Asr',dhuhr+A(1)],['Maghrib',dhuhr+T(0.833)],['Isha',dhuhr+T(ISHA)]];
  }
  function hm(h){h=(h+24)%24;var H=Math.floor(h),Mi=Math.round((h-H)*60);if(Mi===60){H++;Mi=0;}return String(H).padStart(2,'0')+':'+String(Mi).padStart(2,'0');}
  var liste=document.getElementById('prListe'),nom=document.getElementById('prNom'),heure=document.getElementById('prHeure'),reste=document.getElementById('prReste'),barre=document.getElementById('prBarre');
  function maj(){
   var now=new Date(),t=calc(now),cur=now.getHours()+now.getMinutes()/60,next=null,prev=null;
